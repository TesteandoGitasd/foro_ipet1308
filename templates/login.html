{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Iniciar Sesión</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Correo institucional o Usuario</label>
                    <input type="text" name="identifier" class="form-control" placeholder="usuario@ipet1308.edu.ar" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Ingresar</button>
            </form>
            <div class="text-center mt-2">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-small text-muted">¿Olvidaste tu contraseña?</a>
            </div>
            <hr class="my-3">
            <p class="text-center mb-0">¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
        </div>
    </div>
</div>
{% endblock %}

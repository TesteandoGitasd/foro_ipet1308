{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Recuperar Contraseña</h3>
            <p class="text-muted text-center small">Ingresa tu correo institucional y te enviaremos un enlace seguro para restablecer el acceso.</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="correo@ipet1308.edu.ar" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar Enlace</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none">← Volver al login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
